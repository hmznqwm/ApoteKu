name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Patch Plugin Podspecs & Sources
        run: |
          python3 -c "
          import glob, os

          pub_cache = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          for f in glob.glob(f'{pub_cache}/**/print_bluetooth_thermal.podspec', recursive=True):
              target = os.path.join(os.path.dirname(f), 'print_bluetooth_thermal_plus.podspec')
              with open(f, 'r') as fp:
                  c = fp.read()
              c = c.replace(\"s.name             = 'print_bluetooth_thermal'\", \"s.name             = 'print_bluetooth_thermal_plus'\")
              with open(target, 'w') as fp:
                  fp.write(c)

          for f in glob.glob(f'{pub_cache}/**/PrintBluetoothThermalPlugin.m', recursive=True):
              with open(f, 'r') as fp:
                  c = fp.read()
              c = c.replace('print_bluetooth_thermal-Swift.h', 'print_bluetooth_thermal_plus-Swift.h')
              c = c.replace('<print_bluetooth_thermal/', '<print_bluetooth_thermal_plus/')
              with open(f, 'w') as fp:
                  fp.write(c)
          "

      - name: Build iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ApoteKu-iOS-Release.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApoteKu-iOS-Release
          path: ApoteKu-iOS-Release.ipa
          retention-days: 14
