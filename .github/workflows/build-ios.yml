name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Release IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Patch Plugin Podspecs
        run: |
          PUB_CACHE_DIR="$HOME/.pub-cache/hosted/pub.dev"
          find "$PUB_CACHE_DIR" -type f -name "print_bluetooth_thermal.podspec" 2>/dev/null | while read -r f; do
            dir="$(dirname "$f")"
            sed "s/s\.name *= *['\"]print_bluetooth_thermal['\"]/s.name             = 'print_bluetooth_thermal_plus'/" "$f" > "$dir/print_bluetooth_thermal_plus.podspec"
          done

      - name: Build iOS Release (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ApoteKu-iOS-Release.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApoteKu-iOS-Release
          path: ApoteKu-iOS-Release.ipa
          retention-days: 14
