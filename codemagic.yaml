workflows:
  ios-release:
    name: ApoteKu iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean & Get Flutter packages
        script: |
          flutter clean
          flutter packages pub get
      - name: Flutter build iOS (Unsigned Release)
        script: |
          flutter build ios --release --no-codesign
      - name: Package .app into .ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ApoteKu-iOS-Release.ipa Payload
          rm -rf Payload
    artifacts:
      - ApoteKu-iOS-Release.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - hamizanqowiem4@gmail.com
        notify:
          success: true
          failure: true
