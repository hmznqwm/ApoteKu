workflows:
  ios-release:
    name: ApoteKu iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean & Get Flutter packages
        script: |
          flutter clean
          flutter packages pub get
      - name: Patch plugin podspecs
        script: |
          echo "Checking for podspecs in pub cache..."
          PUB_CACHE_DIR="$HOME/.pub-cache/hosted/pub.dev"
          find "$PUB_CACHE_DIR" -type f -name "print_bluetooth_thermal.podspec" 2>/dev/null | while read -r f; do
            dir="$(dirname "$f")"
            sed "s/s\.name *= *['\"]print_bluetooth_thermal['\"]/s.name             = 'print_bluetooth_thermal_plus'/" "$f" > "$dir/print_bluetooth_thermal_plus.podspec"
            echo "Created $dir/print_bluetooth_thermal_plus.podspec"
          done
          # Pre-create symlinks if needed
          flutter precache --ios
      - name: Flutter build iOS (Unsigned Release)
        script: |
          flutter build ios --release --no-codesign
      - name: Package .app into .ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ApoteKu-iOS-Release.ipa Payload
          rm -rf Payload
    artifacts:
      - ApoteKu-iOS-Release.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - hamizanqowiem4@gmail.com
        notify:
          success: true
          failure: true
