workflows:
  ios-release:
    name: ApoteKu iOS Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean & Get Flutter packages
        script: |
          flutter clean
          flutter packages pub get
      - name: Patch plugin podspecs & sources
        script: |
          echo "Patching print_bluetooth_thermal_plus podspec and Objective-C imports..."
          python3 -c "
          import glob, os

          pub_cache = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          for f in glob.glob(f'{pub_cache}/**/print_bluetooth_thermal.podspec', recursive=True):
              target = os.path.join(os.path.dirname(f), 'print_bluetooth_thermal_plus.podspec')
              with open(f, 'r') as fp:
                  c = fp.read()
              c = c.replace(\"s.name             = 'print_bluetooth_thermal'\", \"s.name             = 'print_bluetooth_thermal_plus'\")
              with open(target, 'w') as fp:
                  fp.write(c)
              print(f'Created {target}')

          for f in glob.glob(f'{pub_cache}/**/PrintBluetoothThermalPlugin.m', recursive=True):
              with open(f, 'r') as fp:
                  c = fp.read()
              c = c.replace('print_bluetooth_thermal-Swift.h', 'print_bluetooth_thermal_plus-Swift.h')
              c = c.replace('<print_bluetooth_thermal/', '<print_bluetooth_thermal_plus/')
              with open(f, 'w') as fp:
                  fp.write(c)
              print(f'Patched {f}')
          "
          flutter precache --ios
      - name: Flutter build iOS (Unsigned Release)
        script: |
          flutter build ios --release --no-codesign
      - name: Package .app into .ipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 ApoteKu-iOS-Release.ipa Payload
          rm -rf Payload
    artifacts:
      - ApoteKu-iOS-Release.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - hamizanqowiem4@gmail.com
        notify:
          success: true
          failure: true
